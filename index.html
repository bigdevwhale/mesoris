    <script>
      // Apply the saved theme before CSS/Vue mount to avoid a flash of the
      // wrong theme. Mirrors useThemeStore's resolution: saved choice wins,
      // otherwise fall back to the OS preference (default dark).
      (function () {
        try {
          var saved = localStorage.getItem('dino-theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
